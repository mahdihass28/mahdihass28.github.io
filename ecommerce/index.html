<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNord – Boutique Électronique</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0F172A; --bg2: #1E293B; --bg3: #334155;
      --accent: #14B8A6; --accent2: #0D9488;
      --text: #F1F5F9; --text2: #94A3B8;
      --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
      --border: #334155;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 16px; }
    /* Navbar */
    .navbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 2.5rem; display: flex; align-items: center; justify-content: space-between; height: 72px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); cursor: pointer; letter-spacing: -0.5px; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-link { color: var(--text2); cursor: pointer; font-weight: 500; transition: color 0.2s; font-size: 1rem; }
    .nav-link:hover, .nav-link.active { color: var(--accent); }
    .nav-portfolio { color: var(--text2); cursor: pointer; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--border); padding: 0.4rem 1rem; border-radius: 7px; transition: all 0.2s; text-decoration: none; }
    .nav-portfolio:hover { border-color: var(--accent); color: var(--accent); }
    .nav-cart { background: var(--accent); color: white; border: none; padding: 0.6rem 1.4rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: background 0.2s; }
    .nav-cart:hover { background: var(--accent2); }
    /* Promo */
    .promo-banner { background: linear-gradient(90deg, var(--accent) 0%, #0891B2 100%); padding: 0.8rem 2rem; text-align: center; font-weight: 600; font-size: 0.9rem; }
    /* Hero */
    .hero { background: linear-gradient(135deg, var(--bg2) 0%, #0d1a2d 60%, var(--bg) 100%); padding: 6rem 2rem 5rem; text-align: center; border-bottom: 1px solid var(--border); }
    .hero-badge { display: inline-block; background: var(--warning); color: #1a1a1a; padding: 0.4rem 1.2rem; border-radius: 100px; font-size: 0.85rem; font-weight: 700; margin-bottom: 1.75rem; text-transform: uppercase; letter-spacing: 1px; }
    .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; line-height: 1.15; margin-bottom: 1.25rem; }
    .hero h1 span { color: var(--accent); }
    .hero-sub { color: var(--text2); font-size: 1.2rem; max-width: 620px; margin: 0 auto 3rem; line-height: 1.8; }
    .hero-btns { display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary { background: var(--accent); color: white; border: none; padding: 1rem 2.25rem; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 8px 25px rgba(20,184,166,0.3); }
    .btn-secondary { background: transparent; color: var(--text); border: 2px solid var(--border); padding: 1rem 2.25rem; border-radius: 10px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    /* Featured */
    .featured { max-width: 1300px; margin: 0 auto; padding: 4rem 2.5rem; }
    .featured h2 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .featured-sub { color: var(--text2); margin-bottom: 2.5rem; font-size: 1rem; }
    .cat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1.25rem; margin-bottom: 3.5rem; }
    .cat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 2rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s; }
    .cat-card:hover { border-color: var(--accent); background: rgba(20,184,166,0.05); transform: translateY(-3px); }
    .cat-emoji { font-size: 3rem; margin-bottom: 0.75rem; }
    .cat-name { font-weight: 700; margin-bottom: 0.25rem; }
    .cat-count { font-size: 0.8rem; color: var(--text2); }
    /* Shop layout */
    .shop-page-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; }
    .shop-container { max-width: 1400px; margin: 0 auto; padding: 2rem; display: grid; grid-template-columns: 270px 1fr; gap: 2rem; }
    /* Sidebar */
    .sidebar { background: var(--bg2); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--border); height: fit-content; position: sticky; top: 80px; }
    .sidebar-title { font-size: 1rem; font-weight: 700; margin-bottom: 1.5rem; }
    .filter-section { margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; }
    .filter-section:last-of-type { border-bottom: none; }
    .filter-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); margin-bottom: 0.75rem; }
    .filter-option { display: flex; align-items: center; gap: 0.6rem; padding: 0.3rem 0; cursor: pointer; }
    .filter-option input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .filter-option label { font-size: 0.88rem; cursor: pointer; color: var(--text2); transition: color 0.15s; flex: 1; }
    .filter-option:hover label { color: var(--text); }
    .filter-count { font-size: 0.72rem; color: var(--text2); background: var(--bg3); padding: 0.1rem 0.45rem; border-radius: 100px; }
    .search-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.875rem; border-radius: 8px; outline: none; font-size: 0.9rem; transition: border-color 0.2s; font-family: inherit; }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text2); }
    .clear-btn { width: 100%; padding: 0.6rem; background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; margin-top: 0.25rem; font-family: inherit; }
    .clear-btn:hover { border-color: var(--danger); color: var(--danger); }
    /* Products */
    .products-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .products-count { color: var(--text2); font-size: 0.88rem; background: var(--bg2); border: 1px solid var(--border); padding: 0.35rem 0.875rem; border-radius: 6px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    /* Product card */
    .product-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: all 0.25s; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); border-color: var(--accent); }
    .product-img { background: var(--bg3); height: 190px; display: flex; align-items: center; justify-content: center; font-size: 5rem; position: relative; }
    .product-badge { position: absolute; top: 0.75rem; right: 0.75rem; background: var(--warning); color: #1a1a1a; padding: 0.2rem 0.55rem; border-radius: 6px; font-size: 0.72rem; font-weight: 700; }
    .product-body { padding: 1.35rem; display: flex; flex-direction: column; flex: 1; }
    .product-brand { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); font-weight: 700; margin-bottom: 0.3rem; }
    .product-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.3; }
    .product-desc { font-size: 0.88rem; color: var(--text2); margin-bottom: 0.875rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
    .product-specs { font-size: 0.78rem; color: var(--text2); background: var(--bg3); padding: 0.45rem 0.75rem; border-radius: 6px; margin-bottom: 0.875rem; }
    .product-rating { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.875rem; }
    .stars { color: var(--warning); font-size: 0.95rem; letter-spacing: -1px; }
    .rating-num { font-size: 0.85rem; color: var(--text2); }
    .product-price { display: flex; align-items: baseline; gap: 0.7rem; margin-bottom: 1rem; }
    .price-current { font-size: 1.4rem; font-weight: 800; }
    .price-old { font-size: 0.95rem; color: var(--text2); text-decoration: line-through; }
    .add-btn { width: 100%; padding: 0.85rem; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.95rem; font-family: inherit; }
    .add-btn:hover { background: var(--accent2); }
    .no-products { text-align: center; padding: 4rem 2rem; color: var(--text2); grid-column: 1/-1; }
    /* Cart */
    .page-container { max-width: 860px; margin: 2rem auto; padding: 0 2rem; }
    .page-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 2rem; }
    .cart-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.25rem; display: flex; align-items: center; gap: 1.25rem; margin-bottom: 0.875rem; }
    .cart-emoji { font-size: 2.5rem; flex-shrink: 0; }
    .cart-info { flex: 1; min-width: 0; }
    .cart-brand { font-size: 0.72rem; text-transform: uppercase; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }
    .cart-name { font-weight: 700; font-size: 0.95rem; }
    .cart-price-cell { font-size: 1.1rem; font-weight: 800; flex-shrink: 0; }
    .qty-wrap { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .qty-btn { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
    .qty-num { font-weight: 700; min-width: 20px; text-align: center; }
    .remove-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 0.82rem; padding: 0.35rem 0.6rem; border-radius: 6px; transition: background 0.15s; flex-shrink: 0; font-family: inherit; }
    .remove-btn:hover { background: rgba(239,68,68,0.1); }
    .cart-summary { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-top: 1.25rem; }
    .sum-row { display: flex; justify-content: space-between; padding: 0.45rem 0; color: var(--text2); font-size: 0.9rem; }
    .sum-row.total { border-top: 1px solid var(--border); margin-top: 0.75rem; padding-top: 1rem; font-weight: 700; font-size: 1.05rem; color: var(--text); }
    .ship-note { font-size: 0.78rem; color: var(--success); margin-top: 0.25rem; }
    .proceed-btn { width: 100%; padding: 1rem; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 1.25rem; transition: background 0.2s; font-family: inherit; }
    .proceed-btn:hover { background: var(--accent2); }
    .empty-cart { text-align: center; padding: 4rem 2rem; color: var(--text2); }
    /* Checkout steps */
    .steps-bar { display: flex; align-items: center; margin-bottom: 2.5rem; }
    .step-item { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .step-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; border: 2px solid var(--border); background: var(--bg); color: var(--text2); transition: all 0.3s; }
    .step-circle.active { border-color: var(--accent); background: var(--accent); color: white; }
    .step-circle.done { border-color: var(--success); background: var(--success); color: white; }
    .step-label { font-size: 0.72rem; margin-top: 0.4rem; color: var(--text2); text-align: center; white-space: nowrap; }
    .step-label.active { color: var(--accent); font-weight: 600; }
    .step-connector { flex: 1; height: 2px; background: var(--border); margin: 0 -1px; position: relative; top: -10px; transition: background 0.3s; }
    .step-connector.done { background: var(--success); }
    /* Forms */
    .form-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; margin-bottom: 1.25rem; }
    .form-card-title { font-size: 1rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--accent); }
    .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-g { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-g label { font-size: 0.82rem; font-weight: 600; color: var(--text2); }
    .form-g input, .form-g select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 0.7rem 0.9rem; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; font-family: inherit; }
    .form-g input:focus, .form-g select:focus { border-color: var(--accent); }
    .form-g input::placeholder { color: var(--text2); }
    .form-g select option { background: var(--bg2); }
    .nav-btns { display: flex; gap: 1rem; margin-top: 1.25rem; }
    .btn-back { flex: 1; padding: 0.875rem; background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .btn-back:hover { border-color: var(--text); color: var(--text); }
    .btn-next { flex: 2; padding: 0.875rem; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; font-family: inherit; }
    .btn-next:hover { background: var(--accent2); }
    /* Confirmation */
    .confirm-wrap { text-align: center; padding: 1.5rem 0 2rem; }
    .confirm-icon { font-size: 5rem; margin-bottom: 1rem; }
    .confirm-title { font-size: 1.8rem; font-weight: 800; color: var(--success); margin-bottom: 0.75rem; }
    .order-tag { display: inline-block; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1.5rem; font-family: monospace; font-size: 1rem; color: var(--accent); margin: 1rem 0; letter-spacing: 1px; }
    .order-recap { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin: 1.25rem 0; text-align: left; }
    .recap-row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .recap-row:last-child { border-bottom: none; }
    .recap-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05rem; border-top: 1px solid var(--border); margin-top: 0.75rem; padding-top: 0.75rem; }
    .confirm-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
    /* Survey */
    .survey-wrap { max-width: 580px; margin: 3rem auto; padding: 0 1.5rem; }
    .survey-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem 2rem; }
    .survey-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.75rem; text-align: center; }
    .survey-sub { color: var(--text2); margin-bottom: 2rem; line-height: 1.7; text-align: center; font-size: 0.95rem; }
    .survey-q-label { font-weight: 600; margin-bottom: 0.75rem; font-size: 0.92rem; }
    .star-row { display: flex; justify-content: center; gap: 0.625rem; margin-bottom: 0.5rem; }
    .star-btn { font-size: 2.2rem; background: none; border: none; cursor: pointer; transition: transform 0.1s; line-height: 1; padding: 0; }
    .star-btn:hover { transform: scale(1.2); }
    .rating-label { text-align: center; font-size: 0.88rem; color: var(--accent); font-weight: 600; min-height: 1.5rem; margin-bottom: 1.5rem; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    .radio-chip { padding: 0.4rem 0.875rem; border-radius: 100px; border: 1px solid var(--border); background: var(--bg3); cursor: pointer; font-size: 0.84rem; transition: all 0.15s; user-select: none; }
    .radio-chip.sel { border-color: var(--accent); background: rgba(20,184,166,0.12); color: var(--accent); font-weight: 600; }
    .survey-textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 0.875rem 1rem; border-radius: 10px; font-size: 0.9rem; resize: vertical; min-height: 110px; outline: none; transition: border-color 0.2s; font-family: inherit; margin-bottom: 1.25rem; }
    .survey-textarea:focus { border-color: var(--accent); }
    .survey-textarea::placeholder { color: var(--text2); }
    .submit-btn { width: 100%; padding: 0.975rem; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; font-family: inherit; }
    .submit-btn:hover { background: var(--accent2); }
    .thanks-wrap { text-align: center; padding: 1.5rem 0; }
    .thanks-emoji { font-size: 3.5rem; margin-bottom: 1rem; }
    /* Toast */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--success); color: white; padding: 0.875rem 1.375rem; border-radius: 10px; font-weight: 600; z-index: 1000; animation: slideIn 0.3s ease; box-shadow: 0 8px 25px rgba(0,0,0,0.35); font-size: 0.9rem; }
    @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    /* Security badge */
    .security-note { background: rgba(20,184,166,0.06); border: 1px solid rgba(20,184,166,0.2); border-radius: 8px; padding: 0.7rem 1rem; font-size: 0.82rem; color: var(--accent); margin-bottom: 1.25rem; }
    /* Order mini-recap inside payment */
    .mini-recap { background: var(--bg3); border-radius: 10px; padding: 1rem; margin-top: 1.25rem; }
    .mini-row { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--text2); padding: 0.3rem 0; }
    .mini-total { display: flex; justify-content: space-between; font-weight: 700; border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.75rem; }
    /* Footer */
    footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 2rem; text-align: center; color: var(--text2); font-size: 0.85rem; margin-top: 4rem; }
    footer a { color: var(--accent); cursor: pointer; text-decoration: none; }
    /* Responsive */
    @media (max-width: 768px) {
      .shop-container { grid-template-columns: 1fr; }
      .cat-grid { grid-template-columns: repeat(2,1fr); }
      .form-grid2 { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .sidebar { position: static; }
    }
  </style>

    /* ─── SHOP ─── */
    function ShopPage({ addToCart }) {
      const [selCats,   setSelCats]   = useState(new Set());
      const [selBrands, setSelBrands] = useState(new Set());
      const [selPrice,  setSelPrice]  = useState(null);
      const [minRating, setMinRating] = useState(0);
      const [search,    setSearch]    = useState('');

      const filtered = useMemo(() => PRODUCTS.filter(p => {
        if (selCats.size   > 0 && !selCats.has(p.cat))                                          return false;
        if (selBrands.size > 0 && !selBrands.has(p.brand))                                      return false;
        if (selPrice && (p.price < selPrice.min || p.price > selPrice.max))                      return false;
        if (p.rating < minRating)                                                                return false;
        if (search && !p.name.toLowerCase().includes(search.toLowerCase())
                   && !p.brand.toLowerCase().includes(search.toLowerCase()))                     return false;
        return true;
      }), [selCats, selBrands, selPrice, minRating, search]);

      function toggleSet(setFn, val) {
        setFn(prev => { const n = new Set(prev); n.has(val) ? n.delete(val) : n.add(val); return n; });
      }
      function clear() { setSelCats(new Set()); setSelBrands(new Set()); setSelPrice(null); setMinRating(0); setSearch(''); }

      return (
        <div>
          <div className="shop-page-header">
            <h1 style={{fontSize:'1.6rem', fontWeight:800, marginBottom:'0.25rem'}}>Boutique</h1>
            <p style={{color:'var(--text2)', fontSize:'0.9rem'}}>
              {PRODUCTS.length} produits disponibles — utilisez les filtres pour trouver exactement ce qu'il vous faut.
            </p>
          </div>
          <div className="shop-container">
            <aside className="sidebar">
              <div className="sidebar-title">🔍 Filtrer les produits</div>

              <div className="filter-section">
                <div className="filter-title">Recherche rapide</div>
                <input className="search-input" type="text" placeholder="Nom, marque..." value={search} onChange={e => setSearch(e.target.value)} />
              </div>

              <div className="filter-section">
                <div className="filter-title">Catégorie</div>
                {CATS.map(cat => (
                  <div key={cat} className="filter-option">
                    <input type="checkbox" id={`c-${cat}`} checked={selCats.has(cat)} onChange={() => toggleSet(setSelCats, cat)} />
                    <label htmlFor={`c-${cat}`}>{ICONS[cat]} {cat}</label>
                    <span className="filter-count">{PRODUCTS.filter(p=>p.cat===cat).length}</span>
                  </div>
                ))}
              </div>

              <div className="filter-section">
                <div className="filter-title">Gamme de prix</div>
                <div className="filter-option">
                  <input type="radio" name="pr" id="pr-all" checked={!selPrice} onChange={() => setSelPrice(null)} />
                  <label htmlFor="pr-all">Tous les prix</label>
                </div>
                {PRICE_RANGES.map((r,i) => (
                  <div key={i} className="filter-option">
                    <input type="radio" name="pr" id={`pr-${i}`} checked={selPrice?.label===r.label} onChange={() => setSelPrice(r)} />
                    <label htmlFor={`pr-${i}`}>{r.label}</label>
                    <span className="filter-count">{PRODUCTS.filter(p=>p.price>=r.min&&p.price<=r.max).length}</span>
                  </div>
                ))}
              </div>

              <div className="filter-section">
                <div className="filter-title">Marque</div>
                {BRANDS.map(b => (
                  <div key={b} className="filter-option">
                    <input type="checkbox" id={`b-${b}`} checked={selBrands.has(b)} onChange={() => toggleSet(setSelBrands, b)} />
                    <label htmlFor={`b-${b}`}>{b}</label>
                    <span className="filter-count">{PRODUCTS.filter(p=>p.brand===b).length}</span>
                  </div>
                ))}
              </div>

              <div className="filter-section">
                <div className="filter-title">Évaluation minimale</div>
                {[[0,'Toutes'],[3,'3 + ★'],[4,'4 + ★'],[4.5,'4,5 + ★']].map(([r,lbl]) => (
                  <div key={r} className="filter-option">
                    <input type="radio" name="rr" id={`rr-${r}`} checked={minRating===r} onChange={() => setMinRating(r)} />
                    <label htmlFor={`rr-${r}`}>{lbl}</label>
                    {r > 0 && <span className="filter-count">{PRODUCTS.filter(p=>p.rating>=r).length}</span>}
                  </div>
                ))}
              </div>

              <button className="clear-btn" onClick={clear}>✕ Effacer tous les filtres</button>
            </aside>

            <main>
              <div className="products-header">
                <span className="products-count">
                  {filtered.length} produit{filtered.length !== 1 ? 's' : ''} trouvé{filtered.length !== 1 ? 's' : ''}

              {filtered.length === 0

                    <p style={{fontWeight:600, marginBottom:'0.5rem'}}>Aucun produit ne correspond à vos critères.</p>
                    <p style={{fontSize:'0.88rem'}}>Essayez de modifier ou d'effacer vos filtres.</p>
                  </div>
                : <div className="products-grid">
                    {filtered.map(p => <ProductCard key={p.id} p={p} onAdd={addToCart} />)}
                  </div>
              }
            </main>
          </div>
        </div>
      );

    /* ─── STEPS BAR ─── */
    function StepsBar({ steps, cur }) {
      return (
        <div className="steps-bar">
          {steps.map((s,i) => (
            <React.Fragment key={s}>
              <div className="step-item">
                <div className={`step-circle${i===cur?' active':i<cur?' done':''}`}>
                  {i < cur ? '✓' : i+1}
                </div>
                <div className={`step-label${i===cur?' active':''}`}>{s}</div>
              </div>
              {i < steps.length-1 && <div className={`step-connector${i<cur?' done':''}`} />}

          ))}
        </div>
      );

    /* ─── CHECKOUT ─── */
    function CheckoutPage({ cart, setCart, setPage }) {
      const [step, setStep] = useState(0);
      const [info, setInfo] = useState({ firstName:'', lastName:'', email:'', address:'', city:'', province:'QC', postal:'' });
      const [pay,  setPay]  = useState({ name:'', card:'', expiry:'', cvv:'' });
      const [orderNum] = useState('TN-' + Math.floor(100000+Math.random()*900000));

      const subtotal = cart.reduce((s,i) => s+i.price*i.qty, 0);
      const taxes    = subtotal * 0.14975;
      const shipping = subtotal >= 200 ? 0 : 9.99;
      const grand    = subtotal + taxes + shipping;

      const steps = ['Panier','Livraison','Paiement','Confirmation'];

      function upQty(id, d) { setCart(prev => prev.map(i => i.id===id ? {...i, qty:Math.max(0,i.qty+d)} : i).filter(i=>i.qty>0)); }
      function rem(id)      { setCart(prev => prev.filter(i => i.id!==id)); }
      function ui(e)        { setInfo(prev => ({...prev, [e.target.name]: e.target.value})); }
      function up(e)        { setPay(prev =>  ({...prev, [e.target.name]: e.target.value})); }

      /* Step 3 — Confirmation */
      if (step === 3) return (
        <div className="page-container">
          <StepsBar steps={steps} cur={3} />
          <div className="confirm-wrap">
            <div className="confirm-icon">🎉</div>
            <h2 className="confirm-title">Commande confirmée !</h2>
            <p style={{color:'var(--text2)', lineHeight:1.7}}>
              Merci pour votre achat ! Un courriel de confirmation a été envoyé à <strong style={{color:'var(--text)'}}>{info.email || 'votre adresse'}</strong>.
              Votre commande sera livrée sous 2 à 5 jours ouvrables.
            </p>
            <div className="order-tag">N° de commande : {orderNum}</div>
            <div className="order-recap">
              <div style={{fontWeight:600, marginBottom:'0.75rem', fontSize:'0.88rem', color:'var(--text2)'}}>Récapitulatif</div>
              {cart.map(i => (
                <div key={i.id} className="recap-row">
                  <span>{i.e} {i.name} ×{i.qty}</span>
                  <span style={{fontWeight:600}}>{fmt(i.price*i.qty)}</span>
                </div>
              ))}
              <div className="recap-total">
                <span>Total payé</span>
                <span style={{color:'var(--accent)'}}>{fmt(grand)}</span>
              </div>
            </div>
            <div className="confirm-btns">
              <button className="btn-primary" onClick={() => { setCart([]); setPage('survey'); }}>
                Donner mon avis 💬
              </button>
              <button className="btn-secondary" onClick={() => { setCart([]); setPage('home'); }}>
                Retour à l'accueil
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="page-container">
          <StepsBar steps={steps} cur={step} />

          {/* Step 0 — Panier */}
          {step === 0 && (
            <div>
              <h2 className="page-title">Votre panier</h2>
              {cart.length === 0
                ? <div className="empty-cart">
                    <div style={{fontSize:'3.5rem', marginBottom:'1rem'}}>🛒</div>
                    <p style={{fontWeight:600, marginBottom:'0.5rem'}}>Votre panier est vide.</p>
                    <button className="btn-primary" style={{marginTop:'1rem'}} onClick={() => setPage('shop')}>Découvrir nos produits</button>
                  </div>
                : <>
                  {cart.map(item => (
                    <div key={item.id} className="cart-item">
                      <span className="cart-emoji">{item.e}</span>
                      <div className="cart-info">
                        <div className="cart-brand">{item.brand}</div>
                        <div className="cart-name">{item.name}</div>
                      </div>
                      <div className="qty-wrap">
                        <button className="qty-btn" onClick={() => upQty(item.id,-1)}>−</button>
                        <span className="qty-num">{item.qty}</span>
                        <button className="qty-btn" onClick={() => upQty(item.id,+1)}>+</button>
                      </div>
                      <div className="cart-price-cell">{fmt(item.price*item.qty)}</div>
                      <button className="remove-btn" onClick={() => rem(item.id)}>✕ Retirer</button>
                    </div>
                  ))}
                  <div className="cart-summary">
                    <div className="sum-row"><span>Sous-total</span><span>{fmt(subtotal)}</span></div>
                    <div className="sum-row"><span>Taxes (TPS + TVQ)</span><span>{fmt(taxes)}</span></div>
                    <div className="sum-row"><span>Livraison</span><span>{shipping===0 ? 'Gratuite ✓' : fmt(shipping)}</span></div>
                    {shipping === 0 && <p className="ship-note">✓ Livraison gratuite pour les commandes de 200 $ et plus !</p>}
                    <div className="sum-row total"><span>Total</span><span>{fmt(grand)}</span></div>
                  </div>
                  <div className="nav-btns">
                    <button className="btn-back" onClick={() => setPage('shop')}>← Continuer mes achats</button>
                    <button className="btn-next" onClick={() => setStep(1)}>Passer à la livraison →</button>
                  </div>
                </>
              }
            </div>
          )}

          {/* Step 1 — Livraison */}
          {step === 1 && (
            <div>
              <div className="form-card">
                <div className="form-card-title">📦 Informations de livraison</div>
                <div className="form-grid2">
                  <div className="form-g"><label>Prénom *</label><input name="firstName" value={info.firstName} onChange={ui} placeholder="Mahdi" /></div>
                  <div className="form-g"><label>Nom *</label><input name="lastName" value={info.lastName} onChange={ui} placeholder="Rouehs" /></div>
                </div>
                <div className="form-g" style={{marginTop:'1rem'}}><label>Adresse courriel *</label><input name="email" type="email" value={info.email} onChange={ui} placeholder="exemple@email.com" /></div>
                <div className="form-g" style={{marginTop:'1rem'}}><label>Adresse *</label><input name="address" value={info.address} onChange={ui} placeholder="123, rue des Érables" /></div>
                <div className="form-grid2" style={{marginTop:'1rem'}}>
                  <div className="form-g"><label>Ville *</label><input name="city" value={info.city} onChange={ui} placeholder="Montréal" /></div>
                  <div className="form-g"><label>Province *</label>
                    <select name="province" value={info.province} onChange={ui}>
                      {['QC','ON','BC','AB','MB','SK','NS','NB','NL','PE','NT','NU','YT'].map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                </div>
                <div className="form-g" style={{marginTop:'1rem'}}><label>Code postal *</label><input name="postal" value={info.postal} onChange={ui} placeholder="H1A 1A1" /></div>
              </div>
              <div className="nav-btns">
                <button className="btn-back" onClick={() => setStep(0)}>← Retour au panier</button>
                <button className="btn-next" onClick={() => setStep(2)}>Continuer vers le paiement →</button>
              </div>
            </div>
          )}

          {/* Step 2 — Paiement */}
          {step === 2 && (
            <div>
              <div className="form-card">
                <div className="form-card-title">💳 Informations de paiement</div>
                <div className="security-note">🔒 Paiement sécurisé par chiffrement SSL 256 bits — vos données sont protégées.</div>
                <div className="form-g"><label>Nom du titulaire *</label><input name="name" value={pay.name} onChange={up} placeholder="Prénom Nom" /></div>
                <div className="form-g" style={{marginTop:'1rem'}}><label>Numéro de carte *</label><input name="card" value={pay.card} onChange={up} placeholder="1234 5678 9012 3456" maxLength="19" /></div>
                <div className="form-grid2" style={{marginTop:'1rem'}}>
                  <div className="form-g"><label>Date d'expiration *</label><input name="expiry" value={pay.expiry} onChange={up} placeholder="MM/AA" maxLength="5" /></div>
                  <div className="form-g"><label>CVV *</label><input name="cvv" value={pay.cvv} onChange={up} placeholder="123" maxLength="4" type="password" /></div>
                </div>
                <div className="mini-recap">
                  <div style={{fontWeight:600, marginBottom:'0.5rem', fontSize:'0.88rem'}}>Votre commande</div>
                  <div className="mini-row"><span>{cart.reduce((s,i)=>s+i.qty,0)} article(s)</span><span>{fmt(subtotal)}</span></div>
                  <div className="mini-row"><span>Taxes</span><span>{fmt(taxes)}</span></div>
                  <div className="mini-row"><span>Livraison</span><span>{shipping===0?'Gratuite':fmt(shipping)}</span></div>
                  <div className="mini-total"><span>Total à payer</span><span style={{color:'var(--accent)'}}>{fmt(grand)}</span></div>
                </div>
              </div>
              <div className="nav-btns">
                <button className="btn-back" onClick={() => setStep(1)}>← Retour à la livraison</button>
                <button className="btn-next" style={{background:'var(--success)'}} onClick={() => setStep(3)}>
                  ✓ Confirmer et payer {fmt(grand)}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

            <div className="survey-q-label">À quelle fréquence faites-vous des achats en ligne ?</div>
            <div className="radio-group">
              {['Rarement','Quelques fois par mois','Chaque semaine','Presque chaque jour'].map(opt => (
                <div key={opt} className={`radio-chip${freq===opt?' sel':''}`} onClick={() => setFreq(opt)}>{opt}</div>
              ))}
            </div>

            <div className="survey-q-label">Recommanderiez-vous TechNord à un proche ?</div>
            <div className="radio-group">
              {['Certainement !','Probablement','Peut-être','Non'].map(opt => (
                <div key={opt} className={`radio-chip${recommend===opt?' sel':''}`} onClick={() => setRecommend(opt)}>{opt}</div>
              ))}
            </div>

            <div className="survey-q-label">Des suggestions ou commentaires ? <span style={{fontWeight:400, color:'var(--text2)'}}>(optionnel)</span></div>
            <textarea className="survey-textarea"
              placeholder="Partagez votre expérience... Qu'avez-vous aimé ? Que pourrions-nous améliorer ?"
              value={comment} onChange={e => setComment(e.target.value)} />

            <button className="submit-btn" onClick={() => setSubmitted(true)}>
              Envoyer mon avis →
            </button>
          </div>
        </div>
      );
    }

    /* ─── APP ─── */
    function App() {
      const [page, setPage] = useState('home');
      const [cart, setCart] = useState([]);
      const [toast, setToast] = useState(null);

      function addToCart(product) {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          return ex
            ? prev.map(i => i.id===product.id ? {...i, qty:i.qty+1} : i)
            : [...prev, {...product, qty:1}];
        });
        setToast(`✓ ${product.name} ajouté au panier !`);
        setTimeout(() => setToast(null), 2600);
      }

      return (
        <>
          <Navbar page={page} setPage={setPage} cart={cart} />
          {page==='home'     && <HomePage     setPage={setPage} addToCart={addToCart} />}
          {page==='shop'     && <ShopPage     addToCart={addToCart} />}
          {page==='checkout' && <CheckoutPage cart={cart} setCart={setCart} setPage={setPage} />}
          {page==='survey'   && <SurveyPage   setPage={setPage} />}
          <footer>
            <p>© 2025 TechNord – Boutique Électronique Canadienne &nbsp;|&nbsp;
              <span onClick={() => setPage('survey')} style={{cursor:'pointer', color:'var(--accent)'}}>Donnez votre avis</span>
            </p>
          </footer>
          {toast && <div className="toast">{toast}</div>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
